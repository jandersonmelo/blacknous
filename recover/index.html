<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Recuperador de Carrinhos Hotmart</title>
  <style>
    .list-actions{display:flex;justify-content:flex-end;margin:-4px 0 14px}.clear-all{background:#fff0f0;color:#c33a3a;border:1px solid #f2caca}
    :root{--blue:#2657d9;--green:#159a50;--red:#c33a3a;--ink:#172033;--muted:#687388;--line:#dce2ec;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.page{max-width:1280px;margin:auto;padding:38px 18px}h1{margin:0 0 8px;font-size:clamp(1.7rem,4vw,2.35rem)}.lead{margin:0 0 26px;color:var(--muted);line-height:1.5}.card,.metric,.table-wrap{background:#fff;border:1px solid var(--line);border-radius:18px}.card{padding:24px;box-shadow:0 10px 30px #1c315011}.fields,.summary{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:700;font-size:.9rem;margin-bottom:8px}.full{grid-column:1/-1}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;font:inherit;outline:0}input:focus{border-color:var(--blue);box-shadow:0 0 0 4px #2657d922}.drop{display:block;margin-top:18px;padding:32px 18px;border:2px dashed #aab7cf;border-radius:14px;text-align:center;cursor:pointer;background:#fbfcff;color:var(--muted)}.drop:hover,.drop.drag{border-color:var(--blue);background:#f0f4ff}.drop strong{display:block;color:var(--ink);margin-bottom:6px}#file{display:none}.status{min-height:20px;color:var(--muted);margin:15px 0 0}.status.error{color:#bb3030}.results{display:none;margin-top:25px}.results.show{display:block}.summary{margin-bottom:14px}.metric{padding:14px}.metric small{display:block;color:var(--muted);margin-bottom:4px}.metric strong{font-size:1.2rem}.recovered-total,.recovered{color:var(--green)}.table-wrap{overflow:auto}table{width:100%;min-width:1050px;border-collapse:collapse}th,td{text-align:left;padding:14px 15px;border-bottom:1px solid #edf0f5;vertical-align:middle}th{background:#f8fafc;color:#596579;text-transform:uppercase;letter-spacing:.04em;font-size:.74rem}tr:last-child td{border:0}.actions{display:flex;gap:7px;flex-wrap:wrap}button{border:0;border-radius:8px;padding:9px 10px;font:700 .8rem Arial;cursor:pointer}.icon-btn{width:35px;height:35px;padding:0;display:grid;place-items:center}.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.wa{background:var(--green);color:#fff}.copy{background:#edf1f6;color:#344054}.recover{background:#e8f7ee;color:#087237}.recover.done{background:var(--green);color:#fff}.delete{background:#fff0f0;color:var(--red)}.recovered{font-weight:700}.muted{color:var(--muted)}.modal{position:fixed;inset:0;z-index:10;display:none;place-items:center;padding:18px;background:#17203388}.modal.open{display:grid}.modal-box{width:min(100%,420px);padding:24px;border-radius:16px;background:#fff;box-shadow:0 24px 60px #17203355}.modal-box h2{margin:0 0 8px;font-size:1.25rem}.modal-box p{margin:0 0 18px;color:var(--muted);line-height:1.45}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.cancel{background:#edf1f6;color:#344054}.confirm{background:var(--blue);color:#fff}.confirm.danger{background:var(--red)}.modal-error{min-height:18px;margin:8px 0 0;color:var(--red);font-size:.85rem}@media(max-width:650px){.page{padding:22px 10px}.card{padding:18px}.fields,.summary{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="page">
    <h1>Recuperador de Carrinhos</h1><p class="lead">Importe o CSV da Hotmart, gere links pré-preenchidos e acompanhe as vendas recuperadas.</p>
    <section class="card">
      <div class="fields">
        <div><label for="sender">Nome para a mensagem</label><input id="sender" placeholder="Ex.: João"></div>
        <div><label for="product">Produto</label><input id="product" placeholder="Ex.: Super brain"></div>
        <div class="full"><label for="checkout">URL base do checkout Hotmart</label><input id="checkout" type="url" placeholder="https://pay.hotmart.com/SEU_CHECKOUT"></div>
      </div>
      <label class="drop" id="drop" for="file"><strong>Arraste o CSV aqui ou clique para selecionar</strong><span id="filename">Cada novo arquivo é somado à lista já salva neste navegador.</span></label>
      <input id="file" type="file" accept=".csv,text/csv"><p class="status" id="status"></p>
    </section>
    <section class="results" id="results">
      <div class="summary"><div class="metric"><small>Compradores salvos</small><strong id="count">0</strong></div><div class="metric"><small>Vendas recuperadas</small><strong class="recovered-total" id="total">R$ 0,00</strong></div></div>
      <div class="list-actions"><button class="clear-all" id="clearAll" type="button">Apagar todos os compradores</button></div>
      <div class="table-wrap"><table><thead><tr><th>Data</th><th>Nome</th><th>Produto</th><th>E-mail</th><th>Telefone</th><th>Endereço</th><th>Status</th><th>Ações</th></tr></thead><tbody id="body"></tbody></table></div>
    </section>
  </main>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box"><h2 id="modalTitle"></h2><p id="modalText"></p><input id="modalValue" inputmode="decimal" placeholder="Ex.: 27,90"><p class="modal-error" id="modalError"></p><div class="modal-actions"><button class="cancel" id="modalCancel">Cancelar</button><button class="confirm" id="modalConfirm">Confirmar</button></div></div>
  </div>
  <script>
    const $=id=>document.getElementById(id),STORAGE='hotmart-cart-recovery-v2',settings={sender:$('sender'),product:$('product'),checkout:$('checkout')},file=$('file'),drop=$('drop'),status=$('status'),modal=$('modal'),modalTitle=$('modalTitle'),modalText=$('modalText'),modalValue=$('modalValue'),modalError=$('modalError'),modalConfirm=$('modalConfirm'),modalCancel=$('modalCancel');let customers=[],modalAction=null;
    const normal=v=>String(v||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,''),money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0);
    function save(){localStorage.setItem(STORAGE,JSON.stringify({customers,settings:{sender:settings.sender.value,product:settings.product.value,checkout:settings.checkout.value}}))}
    function load(){try{let s=JSON.parse(localStorage.getItem(STORAGE)||'{}');customers=Array.isArray(s.customers)?s.customers:[];Object.entries(s.settings||{}).forEach(([k,v])=>{if(settings[k])settings[k].value=v||''})}catch{customers=[]}render()}
    function csv(t,s){let o=[],r=[],f='',q=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(c==='"'){if(q&&n==='"'){f+='"';i++}else q=!q}else if(c===s&&!q){r.push(f.trim());f=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;r.push(f.trim());if(r.some(x=>x))o.push(r);r=[];f=''}else f+=c}r.push(f.trim());if(r.some(x=>x))o.push(r);return o}
    function col(h,n){return h.map(normal).findIndex(x=>n.includes(x))}
    function phone(v){let d=String(v||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('55')&&(d.length===12||d.length===13))d=d.slice(2);if(d.length!==10&&d.length!==11)return null;return{ddd:d.slice(0,2),number:d.slice(2),wa:'55'+d,display:'+55 ('+d.slice(0,2)+') '+d.slice(2)}}
    function checkout(c){let b=c.checkoutBase,x=b.indexOf('#'),before=x<0?b:b.slice(0,x),anchor=x<0?'':b.slice(x),sep=before.includes('?')?(before.endsWith('?')||before.endsWith('&')?'':'&'):'?',p=['name='+encodeURIComponent(c.name),'email='+encodeURIComponent(c.email),'phoneac='+encodeURIComponent(c.ddd),'phonenumber='+encodeURIComponent(c.number)];if(c.document)p.push('doc='+encodeURIComponent(c.document));if(c.zip)p.push('zip='+encodeURIComponent(c.zip));return before+sep+p.join('&')+anchor}
    function wa(c){let first=String(c.name||'').trim().split(/\s+/)[0]||'tudo bem',msg='Olá! '+first+', tudo bem? Aqui é '+(c.senderName||'João')+', da equipe do '+(c.productName||'nosso produto')+'. Notei que você não finalizou sua inscrição no '+(c.productName||'produto')+' e passei para lembrar que nossa oferta especial encerra hoje. Se você teve alguma dúvida ou problema no pagamento, me responde aqui para eu te ajudar, ou clique direto no link seguro para garantir seu acesso imediato: '+checkout(c);return 'https://wa.me/'+c.wa+'?text='+encodeURIComponent(msg)}
    async function copy(t,b){try{await navigator.clipboard.writeText(t)}catch{let a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove()}let o=b.textContent;b.textContent='Copiado!';setTimeout(()=>b.textContent=o,1400)}
    function openModal({title,text,value=false,confirm='Confirmar',danger=false,onConfirm}){modalTitle.textContent=title;modalText.textContent=text;modalValue.hidden=!value;modalValue.value='';modalError.textContent='';modalConfirm.textContent=confirm;modalConfirm.className='confirm'+(danger?' danger':'');modalAction=onConfirm;modal.classList.add('open');if(value)setTimeout(()=>modalValue.focus(),0)}
    function closeModal(){modal.classList.remove('open');modalAction=null}
    modalCancel.onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};modalConfirm.onclick=()=>{if(modalAction)modalAction()};modalValue.onkeydown=e=>{if(e.key==='Enter')modalConfirm.click()};
    function remove(id){openModal({title:'Excluir comprador?',text:'Esta ação remove o comprador salvo neste navegador.',confirm:'Excluir',danger:true,onConfirm:()=>{customers=customers.filter(c=>c.id!==id);save();render();closeModal()}})}
    function removeAll(){openModal({title:'Apagar todos os compradores?',text:'Esta ação remove permanentemente todos os compradores salvos neste navegador.',confirm:'Apagar todos',danger:true,onConfirm:()=>{customers=[];save();render();closeModal()}})}
    function recovery(c){if(c.recovered){c.recovered=false;c.recoveredValue=0;save();render();return}openModal({title:'Registrar venda recuperada',text:'Informe o valor recuperado nesta venda.',value:true,confirm:'Salvar venda',onConfirm:()=>{let v=Number(String(modalValue.value).replace(/\./g,'').replace(',','.'));if(!Number.isFinite(v)||v<=0){modalError.textContent='Informe um valor válido maior que zero.';return}c.recovered=true;c.recoveredValue=v;save();render();closeModal()}})}
    const icons={whatsapp:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.6a8.4 8.4 0 0 1-12.4 7.4L3.5 20.5 5 15.9A8.4 8.4 0 1 1 20.5 11.6Z"/><path d="M8.7 7.9c.2-.5.5-.5.8-.5h.4c.2 0 .4.1.5.4l.7 1.7c.1.3.1.5-.1.7l-.5.6c.7 1.3 1.7 2.3 3 3l.6-.5c.2-.2.4-.2.7-.1l1.7.7c.3.1.4.3.4.5v.4c0 .3 0 .6-.5.8-.5.2-1.5.4-3.5-.5-1.2-.5-2.4-1.7-3.1-2.8-.9-1.5-1.4-3.1-1.2-3.9Z"/></svg>',copy:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg>',recover:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',delete:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M9 7l1-3h4l1 3m-9 0 1 13h10l1-13"/></svg>'};
    function render(){let b=$('body');b.innerHTML='';let total=customers.reduce((s,c)=>s+(c.recovered?Number(c.recoveredValue)||0:0),0);$('count').textContent=customers.length;$('total').textContent=money(total);customers.forEach(c=>{let tr=document.createElement('tr');[c.date||'Não informada',c.name,c.productName||'Não informado',c.email,c.display,c.address||'Não informado'].forEach(v=>{let td=document.createElement('td');td.textContent=v;tr.append(td)});let st=document.createElement('td');st.innerHTML=c.recovered?'<span class="recovered">Recuperada<br>'+money(c.recoveredValue)+'</span>':'<span class="muted">Pendente</span>';tr.append(st);let td=document.createElement('td'),a=document.createElement('div'),cp;a.className='actions';[['Abrir WhatsApp','wa','whatsapp',()=>window.open(wa(c),'_blank','noopener,noreferrer')],['Copiar link','copy','copy',()=>copy(checkout(c),cp)],[c.recovered?'Desmarcar venda recuperada':'Marcar como recuperada','recover'+(c.recovered?' done':''),'recover',()=>recovery(c)],['Excluir comprador','delete','delete',()=>remove(c.id)]].forEach(([txt,cl,icon,fn],i)=>{let bt=document.createElement('button');bt.className=cl+' icon-btn';bt.title=txt;bt.setAttribute('aria-label',txt);bt.innerHTML=icons[icon];bt.onclick=fn;if(i===1)cp=bt;a.append(bt)});td.append(a);tr.append(td);b.append(tr)});$('results').classList.toggle('show',customers.length>0)}
    function process(input){let base=settings.checkout.value.trim(),sender=settings.sender.value.trim(),product=settings.product.value.trim();try{new URL(base)}catch{status.textContent='Informe uma URL de checkout válida antes de importar o CSV.';status.className='status error';return}if(!sender||!product){status.textContent='Preencha o nome e o produto antes de importar o CSV.';status.className='status error';return}let r=new FileReader();r.onload=e=>{try{let t=String(e.target.result).replace(/^\uFEFF/,''),first=t.split(/\r?\n/,1)[0],rows=csv(t,(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',');if(rows.length<2)throw Error('O CSV não possui dados suficientes.');let h=rows[0],ni=col(h,['nomedocomprador','nome','buyername','name','firstname']),ei=col(h,['email','emaildocomprador','buyeremail']),pi=col(h,['telefone','phone','celular','telefonedocomprador','buyerphone']),di=col(h,['ddd','areacode','phoneac']),zi=col(h,['cep','zip','zipcode']),datei=col(h,['datadevenda','saledate','data']),ci=col(h,['cidade','city']),si=col(h,['estado','state']),bi=col(h,['bairro','district','neighborhood']),ai=col(h,['endereco','address']),numi=col(h,['numero','addressnumber']),compi=col(h,['complemento','additionalinfo','addressline2']),doc=h.findIndex((v,i)=>i>ni&&['documento','cpf','cnpj','document','buyerdocument'].includes(normal(v)));if(ni<0||ei<0||pi<0)throw Error('Não encontrei Nome, E-mail e Telefone nos cabeçalhos do CSV.');let invalid=0,added=0;rows.slice(1).forEach(row=>{let p=phone((di>=0?row[di]:'')+(row[pi]||''));if(!p){invalid++;return}let address=[[row[ai],row[numi]].filter(Boolean).join(', '),row[compi],[row[bi],row[ci],row[si]].filter(Boolean).join(' - '),row[zi]?'CEP: '+row[zi]:''].filter(Boolean).join(' · ');customers.push({id:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),name:row[ni]||'Cliente',email:row[ei]||'',document:doc>=0?String(row[doc]||'').replace(/\D/g,''):'',zip:zi>=0?String(row[zi]||'').replace(/\D/g,''):'',date:datei>=0?row[datei]||'':'',address,senderName:sender,productName:product,checkoutBase:base,recovered:false,recoveredValue:0,...p});added++});if(!added)throw Error('Nenhum telefone brasileiro válido foi encontrado.');save();render();status.textContent=added+' comprador(es) adicionado(s) à lista.'+(invalid?' '+invalid+' linha(s) foram ignoradas.':'');status.className='status'}catch(e){status.textContent=e.message;status.className='status error'}};r.onerror=()=>{status.textContent='Não foi possível ler o arquivo.';status.className='status error'};r.readAsText(input,'UTF-8')}
    Object.values(settings).forEach(i=>i.addEventListener('input',save));$('clearAll').onclick=removeAll;file.onchange=()=>{let f=file.files[0];if(f){$('filename').textContent=f.name;process(f)}};['dragenter','dragover'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>{let f=e.dataTransfer.files[0];if(f){$('filename').textContent=f.name;process(f)}});load();
  </script>
</body>
</html>
