<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flashcards Concursos - Informática</title>
    <meta name="description" content="50 Flashcards de Informática para Concursos Públicos. Estude de forma interativa.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-animation">
        <div class="bg-orb"></div>
        <div class="bg-orb"></div>
        <div class="bg-orb"></div>
    </div>

    <div class="app-shell">
        <!-- ── Top Bar ── -->
        <header class="top-bar">
            <div class="top-bar-left">
                <span class="app-logo">📚</span>
                <div class="app-title-group">
                    <h1 class="app-title">Flashcards</h1>
                    <span class="app-subtitle">Informática • Concursos</span>
                </div>
            </div>
            <div class="top-bar-right">
                <div class="progress-pill" id="progress-pill">
                    <div class="progress-ring">
                        <svg viewBox="0 0 36 36">
                            <path class="ring-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                            <path class="ring-fill" id="progress-ring-fill" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                        </svg>
                        <span class="ring-text" id="progress-percent">0%</span>
                    </div>
                    <span class="progress-label"><span id="studied-cards">0</span>/<span id="total-cards">50</span></span>
                </div>
                <button class="icon-btn" id="music-toggle" title="Música">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <line x1="23" y1="9" x2="17" y2="15"></line>
                        <line x1="17" y1="9" x2="23" y2="15"></line>
                    </svg>
                </button>
                <audio id="bg-music" loop>
                    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg">
                </audio>
            </div>
        </header>

        <!-- ── Category Chips (horizontal scroll) ── -->
        <div class="category-strip" id="category-filters">
            <button class="cat-chip active" data-category="all">Todos</button>
            <!-- Dynamic categories injected by JS -->
        </div>

        <!-- ── Card Area (central, fills remaining space) ── -->
        <main class="card-stage">
            <div class="card-viewport" id="cards-grid">
                <!-- Flashcard rendered here by JS -->
            </div>

            <!-- Swipe hint (mobile) -->
            <div class="swipe-hint" id="swipe-hint">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                Toque no card para virar
            </div>
        </main>

        <!-- ── Bottom Toolbar ── -->
        <nav class="bottom-bar">
            <button class="bar-btn" id="prev-btn" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>

            <button class="bar-btn accent" id="shuffle-btn" title="Embaralhar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
            </button>

            <div class="card-counter" id="card-counter">
                <span id="current-index">0</span> / <span id="total-filtered">0</span>
            </div>

            <button class="bar-btn" id="reset-btn" title="Zerar Progresso">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
            </button>

            <button class="bar-btn" id="next-btn" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
        </nav>
    </div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
