<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>50 Questões de Informática - App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- App Layout Container -->
    <div class="app-container no-print">
        
        <!-- App Header (Fixed Top) -->
        <header class="app-header">
            <div class="header-inner">
                <div class="header-top">
                    <div class="app-title">
                        <span class="icon">💻</span>
                        <h1>Informática</h1>
                    </div>
                    <div class="progress-text">
                        <span id="current-q-num">1</span> / <span id="total-q-num">50</span>
                    </div>
                </div>
                <div class="progress-bar-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="app-main">
            <!-- Question card will be injected here by JS -->
            <div id="card-container" class="card-container">
                <!-- Template for card -->
            </div>
        </main>

        <!-- Bottom Navigation (Fixed Bottom) -->
        <nav class="bottom-nav">
            <div class="bottom-nav-inner">
                <button id="btn-prev" class="nav-btn" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                    <span>Anterior</span>
                </button>
                <button id="btn-print-app" class="nav-btn secondary" title="Imprimir em A4">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                </button>
                <button id="btn-next" class="nav-btn primary">
                    <span>Próxima</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                </button>
            </div>
        </nav>
    </div>

    <!-- Print Only Content -->
    <div class="print-container only-print">
        <div class="print-header">
            <h1>Material de Estudo - Informática para Concursos (Nível Médio)</h1>
            <p>Gabarito e resoluções incluídos.</p>
        </div>
        <div id="print-questions-container">
            <!-- All questions injected here for printing -->
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Deslize para navegar pelas questões</div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
