<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="http://www.blacknous.com/imgs/icon.webp">
    <title>Blacknous Finanças e Digital | Links</title>

    <!-- Meta tags SEO -->
    <meta name="description"
        content="Gestão inteligente e estruturada para sua empresa. Acesse nossos canais de atendimento e redes sociais.">
    <meta name="theme-color" content="#07080a">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="https://www.blacknous.com/style.css">

    <style>
        /* Destaque especial para a troca de contabilidade */
        .links-wrapper .accounting-banner {
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 1.25fr) minmax(125px, .75fr);
            min-height: 142px;
            padding: 0;
            overflow: hidden;
            isolation: isolate;
            text-decoration: none;
            color: #fff;
            background: linear-gradient(120deg, #151b32 0%, #10172c 62%, #0b1122 100%);
            border: 1px solid rgba(134, 164, 255, .36);
            border-radius: 18px;
            box-shadow: 0 12px 32px rgba(2, 7, 22, .3);
            transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
        }

        .links-wrapper .accounting-banner:hover {
            transform: translateY(-4px);
            border-color: rgba(169, 191, 255, .78);
            box-shadow: 0 18px 40px rgba(2, 7, 22, .45);
        }

        .accounting-banner__content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 8px;
            padding: 20px 10px 20px 21px;
        }

        .accounting-banner__eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 9px;
            color: #dce7ff;
            font-size: .68rem;
            font-weight: 700;
            letter-spacing: .07em;
            line-height: 1;
            text-transform: uppercase;
            background: rgba(127, 158, 255, .16);
            border: 1px solid rgba(173, 193, 255, .22);
            border-radius: 999px;
        }

        .accounting-banner__title {
            max-width: 235px;
            margin: 0;
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1.16;
        }

        .accounting-banner__title strong {
            color: #a9c2ff;
        }

        .accounting-banner__description {
            margin: 0;
            color: rgba(234, 240, 255, .76);
            font-size: .75rem;
            line-height: 1.3;
        }

        .accounting-banner__cta {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-top: 4px;
            padding: 9px 13px;
            color: #fff;
            font-size: .88rem;
            font-weight: 700;
            line-height: 1;
            background: #6f93ff;
            border-radius: 999px;
            box-shadow: 0 6px 14px rgba(73, 111, 225, .28);
        }

        .accounting-banner__cta i {
            transition: transform .25s ease;
        }

        .accounting-banner:hover .accounting-banner__cta i {
            transform: translateX(4px);
        }

        .accounting-banner__image {
            position: relative;
            min-width: 0;
            overflow: hidden;
        }

        .accounting-banner__image::before {
            position: absolute;
            z-index: 1;
            inset: 0;
            content: "";
            background: linear-gradient(90deg, #10172c 0%, rgba(16, 23, 44, .58) 22%, transparent 62%), linear-gradient(0deg, rgba(5, 9, 22, .25), rgba(5, 9, 22, .05));
        }

        .accounting-banner__image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transform: scale(1.03);
            transition: transform .45s ease;
        }

        .accounting-banner:hover .accounting-banner__image img {
            transform: scale(1.1);
        }

        @media (max-width: 430px) {
            .links-wrapper .accounting-banner {
                grid-template-columns: minmax(0, 1.18fr) minmax(105px, .82fr);
                min-height: 136px;
            }

            .accounting-banner__content {
                padding: 17px 4px 17px 17px;
            }

            .accounting-banner__title {
                font-size: .96rem;
            }

            .accounting-banner__description {
                font-size: .7rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .links-wrapper .accounting-banner,
            .accounting-banner__image img,
            .accounting-banner__cta i {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <!-- Animated Background Orbs -->
    <div class="bg-orbs" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Main Container -->
    <main class="container">

        <!-- Profile Section -->
        <header class="profile">
            <div class="profile-img-wrapper" id="profile-picture">
                <img src="https://www.blacknous.com/logo.webp" alt="Logo da Blacknous Assessoria Contábil" class="profile-img">
            </div>
            <h1 class="profile-name">Blacknous</h1>
            <p class="profile-desc">Soluções inteligente e estruturada para pequenas e médias empresas.</p>
        </header>

        <!-- Links Section -->
        <nav class="links-wrapper" aria-label="Links Sociais e Contato">

            <a href="https://wa.me/5591984938236?text=Olá, preciso de ajuda com Contabilidade/Finanças." class="link-item" target="_blank" rel="noopener noreferrer"
                id="link-whatsapp">
                <div class="link-icon-wrapper">
                    <i class="fa-brands fa-whatsapp icon-whatsapp"></i>
                </div>
                <span class="link-text">Contato via WhatsApp</span>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>

            <a href="https://www.youtube.com/@blacknousc" class="link-item" target="_blank" rel="noopener noreferrer"
                id="link-youtube">
                <div class="link-icon-wrapper">
                    <i class="fa-brands fa-youtube icon-youtube"></i>
                </div>
                <span class="link-text">Canal no YouTube</span>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>

            <a href="https://instagram.com/blacknousc" class="link-item" target="_blank" rel="noopener noreferrer"
                id="link-instagram">
                <div class="link-icon-wrapper">
                    <i class="fa-brands fa-instagram icon-instagram"></i>
                </div>
                <span class="link-text">Instagram</span>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>

            <a href="https://www.blacknous.com" class="link-item accounting-banner" target="_blank"
                rel="noopener noreferrer" id="link-accounting">
                <span class="accounting-banner__content">
                    <span class="accounting-banner__eyebrow"><i class="fa-solid fa-briefcase"></i> Soluções para empresas</span>
                    <span class="accounting-banner__title">Serviços de <strong>Contabilidade.</strong></span>
                    <span class="accounting-banner__description">Gestão contábil estratégica, simples e segura para o seu negócio.</span>
                    <span class="accounting-banner__cta">SAIBA MAIS <i class="fa-solid fa-arrow-right"></i></span>
                </span>
                <span class="accounting-banner__image" aria-hidden="true">
                    <img src="https://www.blacknous.com/banner.webp" alt="">
                </span>
            </a>

        </nav>

        <!-- Footer Section -->
        <footer>
            <p>Blacknous Finanças e Digital Ltda</p>
        </footer>

    </main>
    
</body>

</html>
